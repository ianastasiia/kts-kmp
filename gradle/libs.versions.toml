# Coroutines
kotlinxCoroutines = "1.10.1"

# ksp
ksp = "2.1.20-2.0.1"

# KVault
kvault = "1.12.0"

# SecretGradlePlugin
secrets-gradle-plugin = "2.0.1"

# Firebase
google-services = "4.4.4"

firebase-bom = "34.11.0"
firebase-crashlytics-plugin = "3.0.6"



[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Сериализация
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerializationJsonVersion"}

# Логирование
napier = { group = "io.github.aakira", name = "napier", version.ref = "napierVersion"}

# Koin
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinVersion" }
